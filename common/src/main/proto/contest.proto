syntax = "proto3";

option java_multiple_files = true;
option java_package = "ro.mpp2026.grpc";
option csharp_namespace = "ContestCommon.Grpc";

package contest;

service ContestRpc {
  rpc Login(LoginRequest) returns (UserResponse);
  rpc Logout(UserRequest) returns (EmptyResponse);

  rpc GetAgeGroups(EmptyRequest) returns (AgeGroupsResponse);
  rpc GetEventsForAgeGroup(AgeGroupRequest) returns (EventsResponse);
  rpc GetEventsForAge(AgeRequest) returns (EventsResponse);
  rpc GetEventSummaries(EmptyRequest) returns (EventSummariesResponse);

  rpc SearchChildren(SearchChildrenRequest) returns (ChildSearchResultsResponse);
  rpc RegisterChild(RegisterChildRequest) returns (EmptyResponse);
  rpc FindChildByCnp(CnpRequest) returns (ChildResponse);
  rpc GetChildEventIds(ChildIdRequest) returns (EventIdsResponse);
  rpc UpdateChildRegistrations(UpdateChildRegistrationsRequest) returns (EmptyResponse);

  rpc SubscribeUpdates(UserRequest) returns (stream UpdateNotification);
}

message EmptyRequest {}
message EmptyResponse {}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message UserRequest {
  string username = 1;
}

message UserDto {
  int64 id = 1;
  string username = 2;
  string password_hash = 3;
  string office = 4;
}

message UserResponse {
  UserDto user = 1;
}

message AgeGroupRequest {
  int32 min_age = 1;
  int32 max_age = 2;
}

message AgeRequest {
  int32 age = 1;
}

message AgeGroupDto {
  int32 min_age = 1;
  int32 max_age = 2;
}

message AgeGroupsResponse {
  repeated AgeGroupDto age_groups = 1;
}

message EventDto {
  int64 id = 1;
  string name = 2;
  int32 distance = 3;
  int32 min_age = 4;
  int32 max_age = 5;
}

message EventsResponse {
  repeated EventDto events = 1;
}

message EventSummaryDto {
  int64 event_id = 1;
  string name = 2;
  int32 distance = 3;
  string age_group = 4;
  int32 participants_count = 5;
}

message EventSummariesResponse {
  repeated EventSummaryDto event_summaries = 1;
}

message SearchChildrenRequest {
  int64 event_id = 1;
  int32 min_age = 2;
  int32 max_age = 3;
}

message ChildSearchResultDto {
  int64 child_id = 1;
  string name = 2;
  int32 age = 3;
  int32 number_of_events = 4;
}

message ChildSearchResultsResponse {
  repeated ChildSearchResultDto search_results = 1;
}

message RegisterChildRequest {
  string name = 1;
  string cnp = 2;
  int32 age = 3;
  repeated int64 event_ids = 4;
}

message CnpRequest {
  string cnp = 1;
}

message ChildIdRequest {
  int64 child_id = 1;
}

message ChildDto {
  int64 id = 1;
  string name = 2;
  string cnp = 3;
  int32 age = 4;
}

message ChildResponse {
  ChildDto child = 1;
}

message EventIdsResponse {
  repeated int64 event_ids = 1;
}

message UpdateChildRegistrationsRequest {
  string cnp = 1;
  repeated int64 event_ids = 2;
}

message UpdateNotification {
  string message = 1;
}